x-node: &node
  image: dfs-lab
  build: .
  command: uvicorn storage_node.app:app --host 0.0.0.0 --port 8000
  depends_on: [metadata]

services:
  postgres:
    image: postgres:16
    environment: [POSTGRES_USER=dfs, POSTGRES_PASSWORD=dfs, POSTGRES_DB=dfs]
    volumes: [pg_data:/var/lib/postgresql/data]

  metadata:
    image: dfs-lab
    build: .
    command: uvicorn metadata_service.app:app --host 0.0.0.0 --port 8000
    restart: on-failure
    ports: ["8000:8000"]
    environment: [DATABASE_URL=postgresql://dfs:dfs@postgres:5432/dfs, ELASTIC_URL=http://elasticsearch:9200]
    depends_on: [postgres]

  gateway:
    image: dfs-lab
    build: .
    command: uvicorn gateway.app:app --host 0.0.0.0 --port 8000
    ports: ["8080:8000"]
    environment: [METADATA_URL=http://metadata:8000, "API_KEYS=secret-midterm-key,rate-test-key", RATE_LIMIT=100]
    depends_on: [metadata]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment: [discovery.type=single-node, xpack.security.enabled=false, "ES_JAVA_OPTS=-Xms512m -Xmx512m"]
    ports: ["9200:9200"]
    volumes: [es_data:/usr/share/elasticsearch/data]

  ui:
    build: ./ui
    ports: ["8081:80"]
    depends_on: [gateway]

  node1:
    <<: *node
    environment: [NODE_ID=node1]
    ports: ["8001:8000"]
    volumes: [node1_data:/data]

  node2:
    <<: *node
    environment: [NODE_ID=node2]
    ports: ["8002:8000"]
    volumes: [node2_data:/data]

  node3:
    <<: *node
    environment: [NODE_ID=node3]
    ports: ["8003:8000"]
    volumes: [node3_data:/data]

  node4:
    <<: *node
    environment: [NODE_ID=node4]
    ports: ["8004:8000"]
    volumes: [node4_data:/data]

volumes:
  node1_data:
  node2_data:
  node3_data:
  node4_data:
  pg_data:
  es_data: