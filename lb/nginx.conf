# Task 7: load balancer in front of the two gateways (round robin).
upstream gateways {
    server gateway1:8000 max_fails=1 fail_timeout=10s;   # after a failure, skip this gateway for 10 s
    server gateway2:8000 max_fails=1 fail_timeout=10s;
}

server {
    listen 8000;
    client_max_body_size 0;                      # no limit on upload size

    location / {
        proxy_pass http://gateways;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_request_buffering off;             # stream uploads to the gateway
        proxy_buffering off;
        proxy_connect_timeout 2s;                # a stopped gateway is detected quickly
        proxy_next_upstream error timeout http_502 http_503;   # then the request goes to the other one
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
