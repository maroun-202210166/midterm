server {
    listen 80;
    client_max_body_size 0;                      # no limit on upload size

    # the browser talks to the gateway through /api (same origin, so no CORS needed)
    location /api/ {
        proxy_pass http://gateway:8000/;
        proxy_http_version 1.1;
        proxy_request_buffering off;             # stream uploads instead of storing them in nginx
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}