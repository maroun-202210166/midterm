# Task 7: storage nodes as a Kubernetes StatefulSet with persistent volumes and health probes.
# Uses the dfs-lab image built by docker compose (Docker Desktop's Kubernetes sees local images).
# Start:  kubectl apply -f k8s/dfs.yaml        Remove: kubectl delete namespace dfs
apiVersion: v1
kind: Namespace
metadata:
  name: dfs
---
# ---------- PostgreSQL (metadata store) ----------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: dfs
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: dfs
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - {name: POSTGRES_USER, value: dfs}
            - {name: POSTGRES_PASSWORD, value: dfs}
            - {name: POSTGRES_DB, value: dfs}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dfs
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
# ---------- metadata service (reachable at http://localhost:30800) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata
  namespace: dfs
spec:
  replicas: 1
  selector:
    matchLabels: {app: metadata}
  template:
    metadata:
      labels: {app: metadata}
    spec:
      containers:
        - name: metadata
          image: dfs-lab
          imagePullPolicy: Never
          command: [uvicorn, metadata_service.app:app, --host, 0.0.0.0, --port, "8000"]
          env:
            - {name: DATABASE_URL, value: "postgresql://dfs:dfs@postgres:5432/dfs"}
          ports: [{containerPort: 8000}]
---
apiVersion: v1
kind: Service
metadata:
  name: metadata
  namespace: dfs
spec:
  type: NodePort
  selector: {app: metadata}
  ports: [{port: 8000, targetPort: 8000, nodePort: 30800}]
---
# ---------- storage nodes: StatefulSet node-0 ... node-3 ----------
# Headless service: gives each pod a stable name, e.g. node-0.node
apiVersion: v1
kind: Service
metadata:
  name: node
  namespace: dfs
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: node}
  ports: [{port: 8000}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: node
  namespace: dfs
spec:
  serviceName: node
  replicas: 4
  selector:
    matchLabels: {app: node}
  template:
    metadata:
      labels: {app: node}
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: node
          image: dfs-lab
          imagePullPolicy: Never
          # the process id is saved so the liveness test can freeze the server
          command: [sh, -c, "uvicorn storage_node.app:app --host 0.0.0.0 --port 8000 & echo $! > /tmp/app.pid; wait"]
          env:
            - name: NODE_ID                      # node-0, node-1, ... (the pod name)
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - {name: NODE_ADDRESS, value: "http://$(NODE_ID).node:8000"}
            - {name: METADATA_URL, value: "http://metadata:8000"}
          ports: [{containerPort: 8000}]
          volumeMounts: [{name: data, mountPath: /data}]
          livenessProbe:                         # no answer 3 times in a row -> Kubernetes restarts the container
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:                        # receives traffic only when /health answers
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
            timeoutSeconds: 3
  volumeClaimTemplates:                          # one persistent volume per node, kept when the pod is recreated
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
